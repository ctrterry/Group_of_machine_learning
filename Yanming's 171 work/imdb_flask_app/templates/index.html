<!DOCTYPE html>
<html>
<head>
    <title>IMDb Prediction (Group Model)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>🎬 IMDb Rating Predictor (Group Model)</h2>

    <form method="post">
        <div class="mb-3">
            <label>Genres:</label><br>
            <input type="checkbox" name="genres" value="Genre_Documentary"> Documentary
            <input type="checkbox" name="genres" value="Genre_Animation"> Animation
            <input type="checkbox" name="genres" value="Genre_Drama"> Drama
            <input type="checkbox" name="genres" value="Genre_Horror"> Horror
        </div>

        <label>Director Facebook Likes (0 - 23000)</label>
        <input type="number" step="any" name="director_facebook_likes" class="form-control mb-2" min="0" max="23000" required>

        <label>Actor 3 Facebook Likes (0 - 23000)</label>
        <input type="number" step="any" name="actor_3_facebook_likes" class="form-control mb-2" min="0" max="23000" required>

        <label>Movie Facebook Likes (0 - 640000)</label>
        <input type="number" step="any" name="movie_facebook_likes" class="form-control mb-2" min="0" max="640000" required>

        <label>Budget Adjusted (0 - 400,000,000)</label>
        <input type="number" step="any" name="budget_adjusted" class="form-control mb-2" min="0" max="400000000" required>

        <label>Runtime (46 - 175 mins)</label>
        <input type="number" step="any" name="runtime" class="form-control mb-2" min="46" max="175" required>

        <label># User Reviews (1 - 1500)</label>
        <input type="number" step="any" name="num_user_for_reviews" class="form-control mb-2" min="1" max="1500" required>

        <label># Critic Reviews (1 - 813)</label>
        <input type="number" step="any" name="num_critic_for_reviews" class="form-control mb-2" min="1" max="813" required>

        <label>Release Year (1916 - 2024)</label>
        <input type="number" name="release_year" class="form-control mb-3" min="1916" max="2024" required>

        <button type="submit" class="btn btn-primary">Predict Rating</button>
    </form>

    {% if prediction is not none %}
        <div class="alert alert-info mt-4">
            🎯 Predicted IMDb Rating: <strong>{{ prediction }}</strong>
        </div>
    {% endif %}
</div>
</body>
</html>
